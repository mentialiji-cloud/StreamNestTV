name: Build Shqip TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ShqipTV-GitHub-Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/ShqipTV :app:assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Shqip-TV-APK
          path: extracted/ShqipTV/app/build/outputs/apk/debug/app-debug.apk
